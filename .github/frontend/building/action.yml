name: Frontend Building

description: Build Next.js frontend

runs:
  using: composite

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
        cache-dependency-path: frontend/dashboard/package-lock.json

    - name: Install dependencies
      shell: bash
      working-directory: frontend/dashboard
      run: npm ci --legacy-peer-deps

    - name: Build
      shell: bash
      working-directory: frontend/dashboard
      run: npm run build